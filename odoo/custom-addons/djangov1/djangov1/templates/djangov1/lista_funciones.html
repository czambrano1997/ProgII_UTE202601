<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Funciones</title>
</head>
<body>
    <h1>Funciones Programadas 🎭</h1>
    {% for funcion in funciones %}
    <div>
        <h3>{{ funcion.obra.titulo }}</h3>
        <p>Fecha: {{ funcion.fecha }}</p>
        <p>Sala: {{ funcion.sala }}</p>
        <p>Entradas disponibles: {{ funcion.entradas_disponibles }}</p>
        <hr>
    </div>
    {% empty %}
    <p>No hay funciones registradas.</p>
    {% endfor %}
    <a href="{% url 'inicio' %}">Volver al Inicio</a>
</body>
</html>
