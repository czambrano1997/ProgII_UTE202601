{% extends 'base.html' %}

{% block title %}Registro de Clientes - La Ideal{% endblock title %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-0 mt-5">
            <div class="card-body p-5">
                <h2 class="text-center fw-bold mb-4">Crear Cuenta</h2>
                <p class="text-center text-muted">Únete a la familia de La Ideal para realizar tus pedidos.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    
                    <button type="submit" class="btn btn-warning w-100 fw-bold shadow-sm mt-3">
                        REGISTRARME
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted">¿Ya tienes una cuenta? 
                        <a href="{% url 'login' %}" class="text-dark fw-bold">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Estilo para que los campos de Django se vean bien con Bootstrap */
    input {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        margin-bottom: 15px;
    }
</style>
{% endblock content %}
