<!DOCTYPE html>
<html lang="es">
<head><title>Ventas</title></head>
<body>
    <h1>Historial de Ventas</h1>
    <ul>
        {% for venta in ventas %}
            <li>
                <strong>Venta #{{ venta.id }}</strong> - Cliente: {{ venta.cliente.nombre_completo }} <br>
                Total: ${{ venta.total }} | Fecha: {{ venta.fecha_venta }}
            </li>
        {% empty %}
            <li>No se han realizado ventas.</li>
        {% endfor %}
    </ul>
</body>
</html>
