<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Clientes</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#fff8fc;
    margin:20px;
}

h1{
    color:#d63384;
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#f8c8dc;
    padding:12px;
}

td{
    padding:10px;
    border:1px solid #ddd;
}

tr:nth-child(even){
    background:#fff0f6;
}
</style>
</head>

<body>

<h1>Clientes de la Floristería</h1>

<table>
<tr>
    <th>Nombre</th>
    <th>Correo</th>
    <th>Teléfono</th>
</tr>

{% for cliente in datos %}
<tr>
    <td>{{ cliente.nombre }}</td>
    <td>{{ cliente.correo }}</td>
    <td>{{ cliente.telefono }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
