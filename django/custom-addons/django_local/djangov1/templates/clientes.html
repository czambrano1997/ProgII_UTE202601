<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Clientes</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color:#fff8fc;
    margin:0;
    padding:0;
}


header{
    background: linear-gradient(
        135deg,
        #ffe6f0,
        #ffd6e7,
        #fff0f6
    );
    padding:30px;
    text-align:center;
    border-bottom:4px solid #d63384;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    margin-bottom:30px;
}

header h1{
    color:#c2185b;
    margin:0;
    font-size:40px;
}

.decoracion{
    color:#d63384;
    font-size:18px;
    margin:10px 0;
}

header p{
    color:#7a2c52;
    font-size:18px;
}


.contenedor{
    width:90%;
    margin:auto;
}


table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

th{
    background:#f8c8dc;
    color:#6d214f;
    padding:14px;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:center;
}

tr:hover{
    background:#fff0f6;
}


footer{
    margin-top:30px;
    text-align:center;
    background:#f8c8dc;
    padding:15px;
    color:#6d214f;
    font-weight:bold;
}

</style>
</head>

<body>

<header>
    <h1>Floristería Primavera</h1>
    <div class="decoracion">
        ❀ ───── ✿ ───── ❀ ───── ✿ ───── ❀
    </div>
    <p>Listado de Clientes</p>
</header>

<div class="contenedor">

<table>

<tr>
    <th>Nombre</th>
    <th>Correo</th>
    <th>Telefono</th>
</tr>

{% for Cliente in datos %}
<tr>
    <td>{{ Cliente.nombre }}</td>
    <td>{{ Cliente.correo}}</td>
    <td>{{ Cliente.telefono }}</td>
</tr>
{% endfor %}

</table>

</div>

<footer>
    Sistema de Gestión de Floristería Primavera © 2026
</footer>

</body>
</html>
