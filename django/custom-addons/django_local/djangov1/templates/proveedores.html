<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Proveedores</title>

<style>

body{

font-family:Arial;

background:#fff8f0;

margin:40px;

}

h1{

text-align:center;

color:#8B0000;

}

table{

width:80%;

margin:auto;

border-collapse:collapse;

background:white;

}

th{

background:#D35400;

color:white;

padding:12px;

}

td{

padding:10px;

border-bottom:1px solid #ddd;

}

tr:hover{

background:#FDEBD0;

}

</style>

</head>

<body>

<h1> Proveedores</h1>

<table>

<tr>

<th>Nombre</th>

<th>Teléfono</th>

<th>Correo</th>

</tr>

{% for proveedor in proveedores %}

<tr>

<td>{{proveedor.nombre}}</td>

<td>{{proveedor.telefono}}</td>

<td>{{proveedor.correo}}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
