<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flores</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#fff8fc;
    margin:20px;
}

h1{
    color:#d63384;
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#f4b6d2;
    padding:12px;
}

td{
    padding:10px;
    border:1px solid #ddd;
}

tr:hover{
    background:#ffe4f2;
}
</style>
</head>

<body>

<h1>🌷 Catálogo de Flores</h1>

<table>
<tr>
    <th>Nombre</th>
    <th>Color</th>
    <th>Precio</th>
    <th>Stock</th>
</tr>

{% for flor in datos %}
<tr>
    <td>{{ flor.nombre }}</td>
    <td>{{ flor.color }}</td>
    <td>${{ flor.precio }}</td>
    <td>{{ flor.stock }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
