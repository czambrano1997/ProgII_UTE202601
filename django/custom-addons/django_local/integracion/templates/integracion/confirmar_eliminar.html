{% extends 'integracion/base.html' %}
{% block title %}Confirmar Eliminación{% endblock %}
{% block content %}
<h1>{{ titulo }}</h1>
<p style="font-size: 1.1rem; color: #475569;">
    ¿Está seguro de que desea eliminar el registro con <strong>ID: {{ id }}</strong>?<br>
    <small style="color: #94a3b8;">Esta acción no se puede deshacer.</small>
</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-eliminar">🗑️ Sí, eliminar</button>
    <a href="{% url 'integracion:'|add:modelo|add:'_lista' %}" class="btn btn-cancelar">Cancelar</a>
</form>
{% endblock %}
