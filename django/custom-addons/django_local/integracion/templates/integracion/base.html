<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Integración Odoo-Django{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem;
            background: #f8fafc;
            color: #1e293b;
        }
        nav {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            padding: 1rem 1.5rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 1.2rem;
            font-weight: 500;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }
        nav a:hover { opacity: 0.85; }
        h1 {
            color: #1d4ed8;
            border-bottom: 3px solid #dbeafe;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        .msg {
            padding: 12px 16px;
            border-radius: 8px;
            margin: 12px 0;
            font-size: 0.95rem;
        }
        .msg-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .msg-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .msg-info { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        th {
            background: #2563eb;
            color: white;
            padding: 12px 14px;
            text-align: left;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        td {
            padding: 12px 14px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f1f5f9; }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-nuevo {
            background: #059669;
            color: white;
            margin-bottom: 1rem;
        }
        .btn-nuevo:hover { box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3); }
        .btn-eliminar {
            background: #dc2626;
            color: white;
            font-size: 0.8rem;
            padding: 6px 12px;
        }
        .btn-eliminar:hover { box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3); }
        .btn-cancelar {
            background: #94a3b8;
            color: white;
        }
        .vacia {
            text-align: center;
            padding: 2.5rem;
            color: #94a3b8;
            font-style: italic;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: #334155;
            font-size: 0.9rem;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            max-width: 400px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-presencial { background: #dbeafe; color: #1e40af; }
        .badge-virtual { background: #fce7f3; color: #be185d; }
        .badge-hibrida { background: #fef3c7; color: #92400e; }
        .badge-activo { background: #d1fae5; color: #065f46; }
        .badge-inactivo { background: #f1f5f9; color: #64748b; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'integracion:carrera_lista' %}">🏫 Carreras</a>
        <a href="{% url 'integracion:periodo_lista' %}">📅 Períodos</a>
        <a href="{% url 'integracion:aula_lista' %}">🏢 Aulas</a>
        <a href="{% url 'integracion:teacher_lista' %}">👨‍🏫 Docentes</a>
        <a href="{% url 'integracion:signature_lista' %}">📚 Materias</a>
    </nav>

    {% if messages %}
        {% for message in messages %}
            <div class="msg msg-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</body>
</html>
