{% extends 'cliente_ute/base.html' %}

{% block content %}
<div class="row">
    <!-- Formulario para crear -->
    <div class="col-md-4">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white">
                <h5 class="card-title mb-0">Nueva Materia</h5>
            </div>
            <div class="card-body">
                <form action="{% url 'crear_materia' %}" method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Nombre de la Materia</label>
                        <input type="text" name="name" class="form-control" placeholder="Ej. Programación II" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Guardar</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Tabla de registros -->
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">Gestión de Materias (`ou.signature`)</h5>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for materia in materias %}
                        <tr>
                            <td>{{ materia.id }}</td>
                            <td>{{ materia.name }}</td>
                            <td class="text-end">
                                <a href="{% url 'eliminar_materia' materia.id %}" 
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('¿Seguro de eliminar esta materia?');">
                                   Eliminar
                                </a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3" class="text-center text-muted py-4">No hay materias registradas.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
