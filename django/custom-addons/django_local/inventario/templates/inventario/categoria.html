<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías — Inventario UTE</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px;
               margin: 2rem auto; padding: 0 1rem; background: #f8fafc; }
        h1   { color: #1d4ed8; border-bottom: 2px solid #dbeafe; padding-bottom: .5rem; }
        .resumen { background: #dbeafe; border-radius: 8px;
                   padding: .6rem 1rem; margin: 1rem 0; font-size: .9rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem;
                background: #fff; border-radius: 10px; overflow: hidden;
                box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        th    { background: #2563eb; color: #fff; padding: 10px 14px;
                text-align: left; font-size: .85rem; }
        td    { padding: 9px 14px; border-bottom: 1px solid #e2e8f0; font-size: .9rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover td      { background: #f1f5f9; }
        .activa   { color: #059669; font-weight: 700; }
        .inactiva { color: #dc2626; font-weight: 700; }
        .vacia    { text-align: center; padding: 2rem; color: #94a3b8; }
        a { display: inline-block; margin-top: 1.5rem; color: #2563eb; }
    </style>
</head>
<body>
    
</body>
</html>
