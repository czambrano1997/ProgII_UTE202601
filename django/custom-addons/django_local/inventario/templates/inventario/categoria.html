<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - Inventario UTE</title>
</head>

<body>

    <h1>Panel de Inventario UTE</h1>
    <h3>{{carrera}}</h3>

    <p>Total de categorias: {{ categorias|length }}</p>

    <table>
        <tr>
            <th>Codigo</th>
            <th>Nombre</th>
            <th>Descripcion</th>
        </tr>

        {% for p in categorias %}
        <tr>
            <td>{{ p.codigo }}</td>
            <td>{{ p.nombre }}</td>
            <td>{{ p.descripcion }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No hay categorias registradas</td>
        </tr>
        {% endfor %}
    </table>

    <hr>
    <a href="/admin/">Panel de administración</a>

</body>

</html>l
