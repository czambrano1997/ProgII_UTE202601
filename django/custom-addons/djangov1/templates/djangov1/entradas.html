{% extends 'djangov1/base.html' %}
{% block content %}
<h2>Entradas de Stock</h2>
{% if entradas %}
<table>
  <tr><th>Producto</th><th>Almacén</th><th>Cantidad</th><th>Fecha</th></tr>
  {% for e in entradas %}
  <tr><td>{{ e.producto.nombre }}</td><td>{{ e.almacen.nombre }}</td><td>{{ e.cantidad }}</td><td>{{ e.fecha }}</td></tr>
  {% endfor %}
</table>
{% else %}
<p>No hay entradas de stock.</p>
{% endif %}
{% endblock %}
