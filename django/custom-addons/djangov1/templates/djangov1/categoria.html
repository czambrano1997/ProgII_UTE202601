<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías de libros</title>
</head>
<body>
    <h1>Categorías</h1>
    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Slug</th>
                <th>Activo</th>
            </tr>
        </thead>
        <tbody>
            {% for categoria in categorias %}
            <tr>
                <td>{{ categoria.nombre }}</td>
                <td>{{ categoria.slug }}</td>
                <td>{{ categoria.activo }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3">No hay categorías registradas.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
