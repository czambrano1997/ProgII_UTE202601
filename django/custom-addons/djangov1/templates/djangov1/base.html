<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aplicacion</title>
  </head>
  <body style="background:#f5f6fa">
    <div class="dv-container">
      <header style="display:flex;align-items:center;justify-content:space-between">
        <h1 style="margin:0">Aplicacion</h1>
        <div style="font-size:0.9rem;color:#666">Tienda de Tecnología</div>
      </header>
      <hr>
      <style>
        .dv-container{max-width:1100px;margin:18px auto;background:#fff;padding:18px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
        .dv-title{font-family: 'Segoe UI', Roboto, Arial, sans-serif;color:#111}
        .dv-btn{display:inline-block;padding:8px 12px;background:#007bff;color:#fff;border-radius:4px;text-decoration:none}
        .dv-table{width:100%;border-collapse:collapse}
        .dv-table th, .dv-table td{border:1px solid #eee;padding:10px;text-align:left}
        .dv-footer{margin-top:18px;text-align:center}
      </style>
      {% block content %}{% endblock %}
      <div class="dv-footer">
        <a class="dv-btn" href="/djangov1/">Menu central</a>
      </div>
    </div>
  </body>
</html>
