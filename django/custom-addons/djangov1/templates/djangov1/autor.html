<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Autores</title>
</head>
<body>
    <h1>Autores</h1>
    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Web</th>
                <th>Activo</th>
            </tr>
        </thead>
        <tbody>
            {% for autor in autores %}
            <tr>
                <td>{{ autor.nombre }}</td>
                <td>{{ autor.email }}</td>
                <td>{{ autor.web }}</td>
                <td>{{ autor.activo }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="4">No hay autores registrados.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
