{% extends 'djangov1/base.html' %}
{% block content %}
<h2>Productos</h2>
{% if productos %}
<table>
  <tr><th>SKU</th><th>Nombre</th><th>Categoría</th><th>Precio</th></tr>
  {% for p in productos %}
  <tr><td>{{ p.sku }}</td><td>{{ p.nombre }}</td><td>{{ p.categoria.nombre }}</td><td>{{ p.precio }}</td></tr>
  {% endfor %}
</table>
{% else %}
<p>No hay productos.</p>
{% endif %}
{% endblock %}
