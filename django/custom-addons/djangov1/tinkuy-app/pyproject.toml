[project]
name = "tinkuy-app"
version = "0.1.0"
description = "Tinkuy — plataforma de eventos universitarios (Django 5.2 + PostgreSQL + Tailwind)."
readme = "README.md"
authors = [
    { name = "Santiago Narvaez", email = "sj.narmor@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django==5.2.*",
    "djangorestframework>=3.17.1",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "factory-boy>=3.3.3",
    "faker>=40.23.0",
    "pyright>=1.1.410",
    "pytailwindcss>=0.3.1",
    "pytest>=9.1.0",
    "pytest-django>=4.12.0",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["tinkuy", "events"]
exclude = ["**/migrations/**"]
