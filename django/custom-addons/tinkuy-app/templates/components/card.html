{# component: card — props: title:str, subtitle:str="", href:str="" #}
<a href="{{ href }}" class="block rounded-2xl border border-gray-200 p-5 hover:shadow-md transition bg-white">
  <h3 class="font-semibold text-gray-900">{{ title }}</h3>
  {% if subtitle %}
  <p class="text-sm text-gray-500 mt-1">{{ subtitle }}</p>
  {% endif %}
</a>
