<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Django V2</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'djangov1/estilo.css' %}">
</head>
<body>
  <header class="navbar">
    <div class="brand">Cancha Manager</div>
    <nav>
      <a href="{% url 'home_futbol' %}">Inicio</a>
      <a href="{% url 'clientes_futbol' %}">Clientes</a>
      <a href="{% url 'hacer_reservas' %}">Reservas</a>
      <a href="{% url 'paquetes_futbol' %}">Paquetes</a>
      <a href="{% url 'inventario_canchas' %}">Inventario</a>
      <a href="{% url 'gestionar_reservas' %}">Gestión</a>
      <a href="{% url 'consumo_cliente' %}">Consumo</a>
    </nav>
  </header>

  <main class="container">
    <div class="page-header">
      <h1 class="page-title">{% block header_title %}{% block title %}Django V1{% endblock %}{% endblock %}</h1>
      <div class="page-rule"></div>
    </div>
    <section class="card">
      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
