{% extends 'djangov1/base.html' %}

{% block title %}Paquetes{% endblock %}

{% block content %}
<h1>Paquetes</h1>
<form method="post">
  {% csrf_token %}
  <input name="nombre_p" type="text" placeholder="Nombre" required>
  <input name="costo_p" type="number" step="0.01" placeholder="Costo" required>
  <textarea name="descripcion" placeholder="Descripción" rows="3"></textarea>
  <button type="submit">Crear</button>
</form>

<table border="1">
  <tr><th>Nombre</th><th>Costo</th><th>Descripción</th></tr>
  {% for p in paquete %}
  <tr>
    <td>{{ p.nombre_p }}</td>
    <td>{{ p.costo_p }}</td>
    <td>{{ p.descripcion }}</td>
  </tr>
  {% empty %}
  <tr><td colspan="3">No hay paquetes</td></tr>
  {% endfor %}
</table>
{% endblock %}
