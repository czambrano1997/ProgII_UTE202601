<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Inventario{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }
        .wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }
        header {
            background: #0f172a;
            color: #f8fafc;
            padding: 24px;
            border-radius: 0 0 16px 16px;
        }
        header h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: -0.03em;
        }
        nav {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        nav a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 10px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        nav a:hover,
        nav a:focus-visible {
            background: #1e293b;
            color: #f8fafc;
        }
        main {
            margin-top: 24px;
        }
        section {
            background: #fff;
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 14px 35px rgba(15, 23, 42, 0.08);
        }
        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #0f172a;
        }
        .card-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            margin-top: 20px;
        }
        .card {
            display: block;
            padding: 18px;
            border-radius: 16px;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            text-decoration: none;
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .card:hover,
        .card:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18);
            background: linear-gradient(135deg, #1e293b, #334155);
        }
        .card strong {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th,
        td {
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background: #f8fafc;
            color: #111827;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            font-size: 0.95rem;
        }
        tr:hover {
            background: #f8fafc;
        }
        .empty {
            margin-top: 16px;
            padding: 18px;
            border-radius: 12px;
            background: #e2e8f0;
            color: #334155;
        }
        footer {
            margin-top: 24px;
            color: #475569;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>Inventario Django</h1>
            <nav>
                <a href="{% url 'inventario:category_list' %}">Categorías</a>
                <a href="{% url 'inventario:supplier_list' %}">Proveedores</a>
                <a href="{% url 'inventario:product_list' %}">Productos</a>
                <a href="{% url 'inventario:inventoryitem_list' %}">Inventario</a>
                <a href="{% url 'inventario:order_list' %}">Órdenes</a>
                <a href="{% url 'inventario:orderitem_list' %}">Items</a>
            </nav>
        </header>
        <main>
            <section>
                <h2>{% block heading %}Listado{% endblock %}</h2>
                {% block content %}{% endblock %}
            </section>
        </main>
        <footer>
            <p>Una vista más clara de tus datos de inventario.</p>
        </footer>
    </div>
</body>
</html>
