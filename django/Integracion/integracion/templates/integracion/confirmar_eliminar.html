<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px;">
    <div class="card border-danger shadow-sm">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">¿Confirmar eliminación?</h4>
        </div>
        <div class="card-body text-center">
            <p class="fs-5">¿Estás seguro de que deseas eliminar el registro <strong>#{{ registro_id }}</strong> de <strong>{{ nombre_display }}</strong>?</p>
            <p class="text-muted small">Esta acción no se puede deshacer en Odoo.</p>
            
            <form method="POST" class="mt-4 d-flex justify-content-center gap-3">
                {% csrf_token %}
                <a href="{% url 'integracion:lista' modelo=modelo %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
