<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear {{ nombre_display }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    
    <!-- Mensajes -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Crear en {{ nombre_display }}</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {% for campo in campos_form %}
                    <div class="mb-3">
                        <label for="{{ campo }}" class="form-label text-capitalize">{{ campo }}</label>
                        <input type="text" class="form-control" id="{{ campo }}" name="{{ campo }}" required>
                    </div>
                {% endfor %}
                
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'integracion:lista' modelo=modelo %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar en Odoo</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
