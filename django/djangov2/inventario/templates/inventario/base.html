<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Inventario{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8faf9;
            color: #0f172a;
        }
        .wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }
        header {
            background: #0d9488;
            color: #f8fafc;
            padding: 24px;
            border-radius: 0 0 16px 16px;
        }
        header h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: -0.03em;
        }
        nav {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        nav a {
            color: #e2f5f2;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }
        nav a:hover,
        nav a:focus-visible {
            background: rgba(255, 255, 255, 0.18);
            color: #f8fafc;
            transform: translateY(-1px);
        }
        main {
            margin-top: 24px;
        }
        .page-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }
        .button-primary {
            background: #0d9488;
            color: #f8fafc;
            box-shadow: 0 12px 24px rgba(13, 148, 136, 0.18);
        }
        .button-secondary {
            background: #e2f5f2;
            color: #0f172a;
        }
        .button:hover,
        .button:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.14);
        }
        .subtitle {
            margin: 0 0 20px;
            color: #475569;
            line-height: 1.7;
        }
        section {
            background: #ffffff;
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 14px 35px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(15, 23, 42, 0.06);
        }
        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #0f172a;
        }
        .card-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            margin-top: 20px;
        }
        .section-title {
            margin: 32px 0 10px;
            font-size: 1.2rem;
            color: #0f172a;
        }
        .card {
            display: block;
            padding: 18px;
            border-radius: 16px;
            background: linear-gradient(135deg, #0f766e, #38bdf8);
            color: #f8fafc;
            text-decoration: none;
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .card:hover,
        .card:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18);
            background: linear-gradient(135deg, #0284c7, #0f766e);
        }
        .card strong {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .form-grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            margin-top: 24px;
        }
        .form-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-field label {
            font-weight: 700;
            color: #0f172a;
        }
        .form-field input,
        .form-field textarea,
        .form-field select {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 1rem;
            background: #f8fafc;
            color: #0f172a;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-field input:focus,
        .form-field textarea:focus,
        .form-field select:focus {
            outline: none;
            border-color: #34d399;
            box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.12);
        }
        .help-text {
            margin: 0;
            color: #475569;
            font-size: 0.95rem;
        }
        .field-error {
            margin: 0;
            color: #b91c1c;
            font-size: 0.95rem;
        }
        .form-actions {
            margin-top: 28px;
        }
        .error-box {
            margin-top: 18px;
            padding: 16px;
            border-radius: 14px;
            background: #fee2e2;
            color: #991b1b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px #f8fafc;
        }
        th,
        td {
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background: #d1fae5;
            color: #0f172a;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            font-size: 0.95rem;
        }
        tr:nth-child(even) {
            background: #f8fafc;
        }
        tr:hover {
            background: #e0f2fe;
        }
        td {
            color: #334155;
        }
        .empty {
            margin-top: 16px;
            padding: 18px;
            border-radius: 12px;
            background: #dbeafe;
            color: #1e293b;
        }
        footer {
            margin-top: 24px;
            color: #334155;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>Inventario Django</h1>
            <nav>
                <a href="{% url 'inventario:category_list' %}">Categorías</a>
                <a href="{% url 'inventario:supplier_list' %}">Proveedores</a>
                <a href="{% url 'inventario:product_list' %}">Productos</a>
                <a href="{% url 'inventario:inventoryitem_list' %}">Inventario</a>
                <a href="{% url 'inventario:order_list' %}">Órdenes</a>
                <a href="{% url 'inventario:orderitem_list' %}">Items</a>
            </nav>
        </header>
        <main>
            <section>
                <h2>{% block heading %}Listado{% endblock %}</h2>
                <div class="page-toolbar">
                    {% block page_actions %}{% endblock %}
                </div>
                {% block content %}{% endblock %}
            </section>
        </main>
        <footer>
            <p>Una vista más clara de tus datos de inventario.</p>
        </footer>
    </div>
</body>
</html>
